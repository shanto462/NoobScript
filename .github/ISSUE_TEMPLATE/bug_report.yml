name: Bug report
description: Something behaves differently from DESIGN.md, or crashes
labels: [bug]
body:
  - type: textarea
    id: script
    attributes:
      label: Smallest script that shows the problem
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
      description: Include the full error output and exit code.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `noob -V`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS, CPU, and LLVM version
    validations:
      required: true

name: Feature request
description: Suggest a language feature, built-in, or tooling change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should it look like in NoobScript?
      description: Slang names welcome.
    validations:
      required: true
